spring.datasource.url=jdbc:postgresql://localhost:5432/edutek_db
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
spring.application.name=edutek-backend
jwt.expiration=86400000

server.error.include-stacktrace=never
server.error.include-exception=false

# Secrets locaux (fichier non versionne) : voir secrets.properties.example
spring.config.import=optional:file:./secrets.properties
