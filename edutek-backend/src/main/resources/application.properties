spring.datasource.url=jdbc:postgresql://localhost:5432/edutek_db
spring.datasource.username=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
spring.application.name=edutek-backend
jwt.expiration=86400000

spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

# Secrets locaux (fichier non versionne) : voir secrets.properties.example
spring.config.import=optional:file:./secrets.properties

# CORS : origines autorisees (Angular en developpement), separees par des virgules
app.cors.allowed-origins=http://localhost:4200
# Limitation des echecs de connexion (en memoire, une seule instance)
app.security.login.max-par-ip-email=5
app.security.login.max-par-ip=30
app.security.login.fenetre-minutes=15
# Swagger / OpenAPI : desactiver en production avec springdoc.api-docs.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Service d'IA : stub = faux service a regles (pas le modele de Deep Learning)
app.ia.mode=http

# Multi-etablissement (lot 7a)
spring.jpa.properties.hibernate.tenant_identifier_resolver=tn.tekup.edutek.config.ResolveurEtablissement
app.etablissement.defaut=tekup
app.etablissement.defaut-nom=TEK-UP University

# Service d'IA (app.ia.mode=http pour l'utiliser ; la cle d'API va dans secrets.properties : app.ia.api-key)
app.ia.url=http://localhost:8000
app.ia.timeout-ms=10000
app.ia.timeout-entrainement-ms=300000
app.ia.entrainement.source=plan
app.ia.entrainement.fichier=


# Fichiers televerses (supports de cours) : dossier relatif au repertoire de lancement du backend
app.stockage.dossier=uploads
app.stockage.taille-max-mo=20
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
