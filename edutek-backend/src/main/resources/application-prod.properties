# Profil de production : java -jar edutek-backend.jar --spring.profiles.active=prod
# Les secrets (mot de passe de la base, jwt.secret, cles n8n) restent dans secrets.properties ou des variables d'environnement.
spring.jpa.show-sql=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
app.cors.allowed-origins=${CORS_ORIGINS:}